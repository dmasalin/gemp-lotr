<script type="text/javascript">
	$("eventsMain").ready(
		function () {
			$("#eventsMain").tabs().addClass("ui-tabs-vertical ui-helper-clearfix");
			$("#event-tabs > ol > li").removeClass("ui-corner-top").addClass("ui-corner-left");
			
			// Sub-tab indexes: 0 = calendar, 1 = leagues, 2 = tournaments.
			var calendar = null;

			// Current Leagues / Current Tournaments: one header row per event, whose See details button opens that
			// event's own drawer right beneath it (eventDrawer.js).  Joining a league re-renders its drawer in place
			// and refreshes the hall's league dropdown and the calendar's "joined" marks.
			var leagueUI = new LeagueResultsUI("/gemp-lotr-server", function () {
				if (hall.tableCreator && hall.tableCreator.formatManager)
					hall.tableCreator.formatManager.updateFormats();
				if (calendar != null)
					calendar.load();
			}, {list: $("#eventLeagueList")});

			var tourneyUI = new TournamentResultsUI("/gemp-lotr-server", {list: $("#eventTournamentList")});

			// Completed events, a month at a time, one kind per sub-tab.  Each panel renders a row's details with
			// the same UI object as the live list above it.  Neither panel requests anything until the viewer
			// presses its Load button (or opens its month dropdown, which fetches the list of months).
			var leagueHistoryUI = new EventHistoryUI(hall.comm, $("#leagueHistory"), "league", leagueUI).show();
			var tournamentHistoryUI = new EventHistoryUI(hall.comm, $("#tournamentHistory"), "tournament", tourneyUI).show();

			// Clicking an event shows its header row and full detail (open drawer) under the calendar; its
			// "Go to League" / "Go to Tournament" button switches to the list and opens that event's drawer there.
			calendar = new EventCalendarUI(hall.comm, $("#eventCalendar"), {
				details: $("#eventDetails"),
				leagueUI: leagueUI,
				tournamentUI: tourneyUI,
				onLeague: function (leagueCode) {
					$("#eventsMain").tabs("option", "active", 1);
					leagueUI.showLeague(leagueCode);
				},
				onTournament: function (tournamentId) {
					$("#eventsMain").tabs("option", "active", 2);
					tourneyUI.showTournament(tournamentId);
				}
			});
			calendar.show();
		});
	
	$("tournamentResults").ready(
				function () {
					
				});

</script>

<div id="eventsMain" class="hall-tab flex-horiz">
	<div id="event-tabs" class="sub-tabs">
		<ol>
			<li><a href="#calendar">Calendar</a></li>
			<li><a href="#leagues">Current Leagues</a></li>
			<li><a href="#tournaments">Current Tournaments</a></li>
		</ol>
	</div>
	<div id="calendar" class="article">
		<div class='top-of-league-form'>
			All dates are server time (UTC / GMT). Click an event to see its details; events you have joined are in <b>bold</b>.
		</div>
		<div id="eventCalendar"></div>
		<div id="eventDetails"></div>
	</div>
	<div id="leagues" class="article">
		
		<div class='top-of-league-form'>
			All times are server time (UTC / GMT).
		</div>
		<div id="eventLeagueList" class="event-list"></div>
		<hr />
		<div id="leagueHistory"></div>
	</div>

	<div id="tournaments" class="article">
		All times are GMT based.
		<div id="eventTournamentList" class="event-list"></div>
		<hr />
		<div id="tournamentHistory"></div>
	</div>
</div>
